<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Prix</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0d0d12; color: #f4f1de;
    font-family: "Courier New", Courier, monospace;
    overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    padding: env(safe-area-inset-top) 8px calc(108px + env(safe-area-inset-bottom));
    box-sizing: border-box;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    width: min(100%, calc((100dvh - 150px) * 256 / 224));
    height: auto;
    border: 4px solid #1a1a22;
    box-shadow: 0 0 0 2px #3d3d4a;
    touch-action: none;
  }
  #screen { position: relative; line-height: 0; }
  /* CRT/scanline toggle: CSS overlay only, off by default */
  #crt {
    display: none; position: absolute; inset: 4px; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.28) 3px, rgba(0,0,0,0) 4px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.45) 100%);
  }
  button.pad {
    position: fixed; bottom: calc(16px + env(safe-area-inset-bottom));
    width: 84px; height: 84px; border-radius: 14px;
    border: 3px solid #f4f1de; background: rgba(244,241,222,0.12);
    color: #f4f1de; font-size: 32px; touch-action: none;
  }
  #btn-left { left: max(12px, env(safe-area-inset-left)); }
  #btn-right { right: max(12px, env(safe-area-inset-right)); }
  button.pad.mid { width: 76px; height: 64px; font-size: 18px; font-weight: bold; letter-spacing: 1px; }
  #btn-brake { left: calc(50% - 82px); }
  #btn-nitro { left: calc(50% + 6px); color: #ffd23f; border-color: #ffd23f; }
  @media (max-width: 380px) { button.pad.mid { width: 60px; } #btn-brake { left: calc(50% - 64px); } #btn-nitro { left: calc(50% + 4px); } }
  button.pad:active { background: rgba(244,241,222,0.4); }
  body.shot #wrap { padding: 0; display: block; }
  body.shot canvas { position: fixed; left: 0; top: 0; width: 256px; height: 224px; border: 0; box-shadow: none; }
  body.shot .pad, body.shot #crt { display: none; }
  body.shot #screen { position: static; }
</style>
</head>
<body>
<div id="wrap">
  <div id="screen"><canvas id="c" width="256" height="224"></canvas><div id="crt"></div></div>
</div>
<button class="pad" id="btn-left" type="button" aria-label="Steer left">◀</button>
<button class="pad" id="btn-right" type="button" aria-label="Steer right">▶</button>
<button class="pad mid" id="btn-brake" type="button" aria-label="Brake (hold)">BRK</button>
<button class="pad mid" id="btn-nitro" type="button" aria-label="Nitro boost">N2O</button>
<script>
(() => {
  "use strict";
  // ---------------------------------------------------------------- setup
  const W = 256, H = 224, STEP = 1 / 120;
  const QS = new URLSearchParams((typeof location !== "undefined" && location.search) || "");
  const SHOT = QS.get("shot");
  const DEBUG = QS.get("debug");
  const SEED = QS.has("seed") ? (Number(QS.get("seed")) >>> 0) : ((Date.now() ^ 0x5eed1) >>> 0);
  function makeRng(seed) {
    let s = seed >>> 0 || 1;
    return () => {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rnd = makeRng(SEED);          // simulation randomness (deterministic per seed)
  const fxRnd = makeRng(SEED ^ 0x9e37); // render-only randomness (shake jitter)
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  ctx.imageSmoothingEnabled = false;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { /* private mode */ } }
  };
  if (SHOT && document.body) document.body.classList.add("shot");

  const ROAD_W = 2000;
  const SEG_LEN = 200;
  const DRAW = 100;
  const CAM_H = 1100;
  const CAM_D = 0.84;
  const HORIZON = 64;
  const MAX_SPEED = 280;
  const PLAYER_SCALE = 3;
  // 3 painted lanes; traffic offsets match the paint (two dashed lines at +-0.31)
  const LANES = [-0.62, 0, 0.62];

  // ---------------------------------------------------------------- palette
  function hexMix(a, b, u) {
    const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
    const pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
    return "#" + pa.map((v, i) => Math.round(v + (pb[i] - v) * u).toString(16).padStart(2, "0")).join("");
  }
  const FOG_U = [0, 0.2, 0.4, 0.58, 0.72]; // 5 stepped fog bands, pre-mixed at load
  const BAND_N = [0, 14, 30, 50, 72];     // segment index n where each band starts
  function bandOf(n) { let b = 0; while (b < 4 && n >= BAND_N[b + 1]) b++; return b; }

  const THEME_SUNSET = {
    name: "sunset",
    sky: ["#1a1028", "#4a2058", "#a33a58", "#e86a3a", "#ffb15a", "#ffe0a0"],
    sun: "#f3ead0", sunRing: "#ffe14a", cloud: "#ffe0a0",
    hillFar: "#7a3a62", hillNear: "#4a2450",
    haze: "#e8b08a",
    grassA: "#1f6b32", grassB: "#174f26", dirt: "#6d5a3a",
    rumbleA: "#ffe14a", rumbleB: "#3a2a48",
    roadA: "#3a3a44", roadB: "#2c2c34", lane: "#ffe14a",
    post: "#f3ead0", postDark: "#24202a",
    trunk: "#6d5a3a", leafA: "#17602c", leafB: "#3cb85a", leafHi: "#8ee07a",
    shadow: "#1a1028"
  };
  function buildTheme(t) {
    const th = Object.assign({}, t);
    const f = (c, b) => (b === 0 ? c : hexMix(c, t.haze, FOG_U[b]));
    th.grass = []; th.road = []; th.rumble = []; th.dirt = []; th.lane = [];
    for (let b = 0; b < 5; b++) {
      th.grass[b] = b < 2 ? [f(t.grassA, b), f(t.grassB, b)] : [f(t.grassA, b), f(t.grassA, b)];
      th.road[b] = b < 3 ? [f(t.roadA, b), f(t.roadB, b)] : [f(t.roadA, b), f(t.roadA, b)];
      th.rumble[b] = b < 2 ? [f(t.rumbleA, b), f(t.rumbleB, b)] : b === 2 ? [f(t.rumbleA, b), th.road[b][1]] : [th.road[b][0], th.road[b][0]];
      th.dirt[b] = b < 3 ? f(t.dirt, b) : th.grass[b][0];
      th.lane[b] = b < 2 ? f(t.lane, b) : null;
    }
    return th;
  }
  THEME_SUNSET.scenery = ["tree", "tree", "tree", "rock"];
  THEME_SUNSET.bgFar = { peaks: [[0, 54], [24, 44], [52, 56], [88, 38], [118, 52], [160, 42], [196, 57], [228, 46], [256, 54]] };
  THEME_SUNSET.bgNear = { peaks: [[0, 64], [30, 58], [64, 63], [104, 55], [140, 63], [184, 57], [220, 63], [244, 59], [256, 64]] };
  THEME_SUNSET.tod = "DUSK";
  // Biomes = palette swaps over the same renderer. Time of day is stepped per stage (day, afternoon, dusk, night).
  const THEMES = {
    sunset: THEME_SUNSET,
    coast: {
      name: "coast", tod: "DAY",
      sky: ["#2a5aa8", "#3a70c0", "#5088d4", "#6aa2e0", "#8ebee8", "#c0dcee"],
      sun: "#fffbe8", sunRing: "#ffe890", cloud: "#f4fbff",
      hillFar: "#8aaed0", hillNear: "#2f6fb0", haze: "#c0dcee",
      grassA: "#e0c886", grassB: "#d4b878", dirt: "#b8985e",
      rumbleA: "#f3ead0", rumbleB: "#2f6fb0", roadA: "#5a5a66", roadB: "#4c4c58", lane: "#f3ead0",
      post: "#f3ead0", postDark: "#24202a", trunk: "#8a6a3a", leafA: "#2a7a3a", leafB: "#5ab04a", leafHi: "#8ee07a",
      shadow: "#3a3440", scenery: ["palm", "palm", "palm", "rock"],
      bgFar: { peaks: [[0, 64], [20, 62], [40, 57], [60, 61], [90, 63], [120, 56], [150, 62], [200, 59], [230, 63], [256, 64]] },
      bgNear: { peaks: [[0, 59], [256, 59]], sparkle: "#f4fbff" }
    },
    desert: {
      name: "desert", tod: "AFTERNOON",
      sky: ["#3a4c9a", "#5a64b4", "#8a7cbc", "#c89490", "#e8b888", "#f6d8a8"],
      sun: "#fff4d0", sunRing: "#ffd070", cloud: "#f6d8a8",
      hillFar: "#c88a5a", hillNear: "#a8643e", haze: "#e8c090",
      grassA: "#d8a860", grassB: "#cc9a54", dirt: "#a87840",
      rumbleA: "#f3ead0", rumbleB: "#a8643e", roadA: "#4a4048", roadB: "#3e3640", lane: "#f3ead0",
      post: "#f3ead0", postDark: "#24202a", trunk: "#6a4a2a", leafA: "#3a7a3a", leafB: "#5aa04a", leafHi: "#8ec070",
      shadow: "#3a2a2a", scenery: ["cactus", "cactus", "rock", "rock"],
      bgFar: { peaks: [[0, 60], [10, 60], [14, 46], [44, 46], [48, 60], [90, 60], [96, 40], [110, 40], [116, 60], [160, 60], [166, 50], [210, 50], [216, 60], [256, 60]] },
      bgNear: { peaks: [[0, 64], [40, 60], [80, 63], [130, 59], [180, 63], [220, 60], [256, 64]] }
    },
    alpine: {
      name: "alpine", tod: "DUSK",
      sky: ["#1c1838", "#2c2a5a", "#4a3c78", "#8a5a8a", "#d8889a", "#f0b8b0"],
      sun: "#ffe0d0", sunRing: "#f0a8a0", cloud: "#f0b8b0",
      hillFar: "#6a6aa0", hillNear: "#3a3a68", haze: "#9a88b0",
      grassA: "#2a5a4a", grassB: "#224d40", dirt: "#5a5060",
      rumbleA: "#e8e8f8", rumbleB: "#5a5a90", roadA: "#3a3a48", roadB: "#30303e", lane: "#e8e8f8",
      post: "#e8e8f8", postDark: "#24202a", trunk: "#4a3028", leafA: "#1a4a3a", leafB: "#2a6a4a", leafHi: "#e8e8f8",
      shadow: "#1c1838", scenery: ["pine", "pine", "pine", "rock"],
      bgFar: { peaks: [[0, 50], [30, 26], [56, 44], [80, 20], [110, 46], [140, 30], [170, 48], [200, 22], [230, 40], [256, 50]], cap: "#e8e8f8", capY: 33 },
      bgNear: { peaks: [[0, 64], [30, 52], [60, 60], [100, 48], [140, 58], [180, 50], [220, 60], [256, 64]] }
    },
    neon: {
      name: "neon", tod: "NIGHT", night: true,
      sky: ["#05040c", "#0a0820", "#120c30", "#1c0f42", "#2a1252", "#3c1660"],
      sun: "#e8e8f8", sunRing: "#9a9ac8", cloud: "#2a1252",
      hillFar: "#1c1440", hillNear: "#120c2a", haze: "#2a1a4a",
      grassA: "#141024", grassB: "#100c1c", dirt: "#1c1830",
      rumbleA: "#3ae0e8", rumbleB: "#b03de2", roadA: "#2a2840", roadB: "#222034", lane: "#3ae0e8",
      roadLit: "#4a4660", headlight: "#3c3a54",
      post: "#3ae0e8", postDark: "#120c2a", trunk: "#8a8a92", leafA: "#ffe890", leafB: "#ffe890", leafHi: "#ffe890",
      shadow: "#05040c", scenery: ["lamp"], skyline: true,
      bgFar: { peaks: [[0, 64], [256, 64]] }, bgNear: { peaks: [[0, 64], [256, 64]] }
    }
  };
  let theme = buildTheme(THEME_SUNSET);
  function setTheme(name) { if (theme.name !== name) theme = buildTheme(THEMES[name] || THEME_SUNSET); }

  // Shared car colours (traffic + player).
  const CARC = { W: "#1b2838", H: "#c9efff", T: "#101010", R: "#ff4a3a", r: "#ffe1b0", P: "#f3ead0", E: "#8a8a92", K: "#24202a" };
  // Traffic bodies: no red (red is player-only).
  const BODIES = ["#d8dce4", "#3d6be2", "#e2c13d", "#3de28a", "#b03de2", "#ff9e2c"];
  const WINGS = ["K", "P", "H"];
  const PLAYER_BODY = "#e23d3d";
  const AMBER = "#ff9e2c"; // blinkers (same entry as the orange livery)
  const UI = { ink: "#101010", cream: "#f3ead0", dim: "#24202a", hot: "#ffe14a" };

  function carMap(body, wingKey, isPlayer) {
    const dark = hexMix(body, "#14080c", 0.58);
    const m = {
      B: body, S: dark, D: dark, L: isPlayer ? hexMix(body, "#fff4d2", 0.42) : CARC.P,
      W: CARC.W, H: CARC.H, G: CARC.T, m: dark, T: CARC.T, t: CARC.K, R: CARC.R, r: CARC.r,
      P: CARC.P, E: CARC.E, K: CARC.K, k: CARC.T
    };
    if (isPlayer) { m.F = "#5a161c"; m.f = dark; } else { m.F = CARC[wingKey]; m.f = CARC.K; }
    return m;
  }
  function allPalette() {
    const s = new Set();
    const add = (v) => { if (typeof v === "string" && v[0] === "#") s.add(v.toLowerCase()); else if (Array.isArray(v)) v.forEach(add); else if (v && typeof v === "object") Object.values(v).forEach(add); };
    for (const k in THEMES) { const t = buildTheme(THEMES[k]); add(t); }
    add(CARC); add(UI);
    add(carMap(PLAYER_BODY, "K", true));
    BODIES.forEach((b) => WINGS.forEach((w) => add(carMap(b, w, false))));
    return [...s];
  }

  // ---------------------------------------------------------------- sprites
  // Rear view. Footprint is the sprite grid; collision uses the projected footprint.
  const CAR_SRC = [
    "......DDDDDDDDDD......",
    ".....DLLLLLLLLLLD.....",
    "....mDWHHHHHHHHWDm....",
    ".....DWGGGGGGGGWD.....",
    "...fFFFFFFFFFFFFFFf...",
    "..DBBBBBBBBBBBBBBBBD..",
    ".DRRRRDBBBBBBBBDRRRRD.",
    ".DrRRRDBBBBBBBBDRRRrD.",
    ".DBBBBBBBPPPPBBBBBBBD.",
    ".DKKKKKKKPPPPKKKKKKKD.",
    ".TTTTkkEkkkkkkEkkTTTT.",
    ".TTTT............TTTT."
  ];
  // Body-edge shading (was the shadeB rule in drawSprite).
  const CAR = CAR_SRC.map((r) => r.split("").map((c, x) => (c === "B" && (x <= 2 || x >= 19) ? "S" : c)).join(""));
  const CAR_W = CAR[0].length;
  const CAR_H = CAR.length;
  const CAR_LOD = [
    "...DLLLD...",
    "..DWGGGWD..",
    ".fFFFFFFFf.",
    "DRRBBBBBRRD",
    "DBBBPPPBBBD",
    ".TTkkkkkTT."
  ];
  const CAR_B = opaqueBounds(CAR), CAR_LOD_B = opaqueBounds(CAR_LOD);
  function initTypes() {
    TYPES.car.rows = TYPES.sports.rows = CAR; TYPES.car.lod = TYPES.sports.lod = CAR_LOD;
    for (const k in TYPES) { const t = TYPES[k]; t.b = opaqueBounds(t.rows); t.lb = t.lod ? opaqueBounds(t.lod) : t.b; }
  }
  const shiftRow = (r, d) => (d > 0 ? "." + r.slice(0, -1) : r.slice(1) + ".");
  // Turn frames, hand-authored, deliberately subtle (gentle Outrun-style hint): the whole car slides
  // toward the turn (FRAME_OFF, same for every row: 1 px mild, 2 px full). Mild = centre art, just shifted.
  // Full = 1-column side panel on the outer flank (rear face 1 px narrower), roof leads 1 px, spoiler,
  // tail lights and tyres exactly as the centre frame. L frames mirror R. Hit box = drawn pixels + offset.
  const TURN_PAD = 3, TURN_W = CAR_W + TURN_PAD * 2;
  const padRow = (r) => ".".repeat(TURN_PAD) + r + ".".repeat(TURN_PAD);
  const R1 = CAR.map(padRow);
  const R2 = [
    "..........DDDDDDDDDD........",
    ".........DLLLLLLLLLLD.......",
    "........mDWHHHHHHHHWDm......",
    ".........DWGGGGGGGGWD.......",
    "......fFFFFFFFFFFFFFFf......",
    ".....DSBBBBBBBBBBBBBBBD.....",
    "....DSRRRRDBBBBBBBDRRRRD....",
    "....DSrRRRDBBBBBBBDRRRrD....",
    "....DSSBBBBBBPPPPBBBBBSD....",
    "....DKKKKKKKKPPPPKKKKKKD....",
    "....TTTTkkEkkkkkkEkkTTTT....",
    "....TTTT............TTTT...."
  ];
  const flipRows = (rows) => rows.map((r) => r.split("").reverse().join(""));
  const CAR_FRAMES = { C: CAR.map(padRow), R1, R2, L1: flipRows(R1), L2: flipRows(R2) };
  const FRAME_OFF = { C: 0, R1: 1, R2: 2, L1: -1, L2: -2 };
  // tyre tread animation: alternate tread pixels on the bottom rows
  function treadFrame(rows, phase) {
    return rows.map((r, y) => (y >= 10 ? r.split("").map((c, x) => (c === "T" && (x + y + phase) % 2 === 0 ? "t" : c)).join("") : r));
  }
  function brakeFrame(rows) { return rows.map((r) => r.replace(/R/g, "r")); }

  const TREE = [
    "....h....",
    "...hbb...",
    "..bbbbb..",
    "..hbbba..",
    ".bbbbbbb.",
    ".hbbbaab.",
    "bbbbbbbbb",
    "abbbbbaaa",
    ".aaaaaaa.",
    "....t....",
    "....t....",
    "....t....",
    "...ttt..."
  ];
  const POST = ["PP", "KK", "PP", "PP", "PP", "PP", "PP", "PP"];
  const PALM = [
    "..aa.aa..", ".aabbbaa.", "aab.b.baa", "a..bbb..a", "...btb...", "..b.t.b..", "....t....", "....t....",
    "...t.....", "...t.....", "...t.....", "....t....", "....t....", "....t....", "...ttt..."];
  const CACTUS = [
    "...a...", "..aba..", "..aba..", "a.aba..", "aaaba.a", ".aaba.a", "..abaaa", "..aba..", "..aba..", "..aba..", "..aba..", ".aabaa."];
  const PINE = [
    "....h....", "...hah...", "...aaa...", "..haaah..", "..aabaa..", ".haaaaah.", ".aaabaaa.", "haaaaaaah", "aaaabaaaa", "..aaaaa..",
    "....t....", "....t....", "...ttt..."];
  const ROCK = ["..rr..", ".rrhr.", "rrrrhr", "rrrrrr"];
  const LAMP = ["lll..", "lllE.", "...E.", "...E.", "...E.", "...E.", "...E.", "...E.", "...E.", "...E.", "...E.", "...E.", "...E.", "...E.", "..EEE"];
  const CHEV = ["kkkkkkkkk", "kykkyyyyk", "kyykkyyyk", "kyyykkyyk", "kyykkyyyk", "kykkyyyyk", "kkkkkkkkk", "....k....", "....k....", "....k...."];
  const mirror = (rows) => rows.map((r) => r.split("").reverse().join(""));
  // Billboards are built from the pixel font so the text is real pixel art.
  function billboardRows(text) {
    const cols = text.length * 6 + 3, rows = [];
    const line = (f) => { let r = ""; for (let x = 0; x < cols; x++) r += f(x); return r; };
    rows.push(line(() => "P"));
    rows.push(line((x) => (x === 0 || x === cols - 1 ? "P" : "k")));
    for (let y = 0; y < 7; y++) rows.push(line((x) => {
      if (x === 0 || x === cols - 1) return "P";
      const cx = x - 2, ci = Math.floor(cx / 6), gx = cx % 6;
      if (cx < 0 || ci >= text.length || gx === 5) return "k";
      const hex = FONT_SRC[text[ci]] || FONT_SRC[" "];
      return parseInt(hex.slice(gx * 2, gx * 2 + 2), 16) & (1 << y) ? "y" : "k";
    }));
    rows.push(line((x) => (x === 0 || x === cols - 1 ? "P" : "k")));
    rows.push(line(() => "P"));
    for (let i = 0; i < 5; i++) rows.push(line((x) => (x === 4 || x === cols - 5 ? "E" : ".")));
    return rows;
  }
  const BILLBOARDS = ["PIXEL PRIX", "TURBO MOTORS", "GO FAST"];
  // Vehicle types: own footprints, read by the projection authority (trafficScreen) for draw AND collision.
  const TRUCK = [
    "..DDDDDDDDDDDDDDDDDDDDDDDD..",
    ".DLLLLLLLLLLLLLLLLLLLLLLLLD.",
    ".DBBBBBBBBBBBDDBBBBBBBBBBBD.",
    ".DBBBBBBBBBBBDDBBBBBBBBBBBD.",
    ".DBBBBBBBBBBBDDBBBBBBBBBBBD.",
    ".DBBBBBBBBBBBDDBBBBBBBBBBBD.",
    ".DBBBBBBBBBEBDDBEBBBBBBBBBD.",
    ".DBBBBBBBBBBBDDBBBBBBBBBBBD.",
    ".DBBBBBBBBBBBDDBBBBBBBBBBBD.",
    ".DBBBBBBBBBBBDDBBBBBBBBBBBD.",
    ".DSSSSSSSSSSSDDSSSSSSSSSSSD.",
    ".DKKKKKKKKKKKKKKKKKKKKKKKKD.",
    ".DRRKKKKKKKKKPPKKKKKKKKKRRD.",
    ".DrRKKKKKKKKKPPKKKKKKKKKRrD.",
    "..KKKKKKKKKKKKKKKKKKKKKKKK..",
    "..TTTTTT............TTTTTT..",
    "..TTTTTT............TTTTTT..",
    "..TTTTTT............TTTTTT.."
  ];
  const BIKE = ["..DDDD..", ".DBHHBD.", "..DBBD..", ".KBBBBK.", "KKBBBBKK", "..BBBB..", "..KKKK..", "..KRRK..", "...TT...", "...TT...", "...TT...", "...TT..."];
  const TYPES = {
    car: { rows: null, lod: null, speed: [0.5, 0.65], weight: 0.55 },
    sports: { rows: null, lod: null, speed: [0.7, 0.8], weight: 0.15, wing: "P" },
    truck: { rows: TRUCK, speed: [0.35, 0.45], weight: 0.18 },
    bike: { rows: BIKE, speed: [0.55, 0.7], weight: 0.12, weave: 0.1 }
  };
  initTypes();

  // Opaque bounds of a sprite grid, mapped to a w x h nearest-neighbour target (used for hit boxes).

  window.addEventListener("blur", () => pause());

  // ---------------------------------------------------------------- review rig: ?shot=scene&seed=N&t=ms
  function findCurve(sign) {
    let bestI = 0, bestC = 0;
    for (const s of segments) if (s.curve * sign > bestC) { bestC = s.curve * sign; bestI = s.index; }
    while (bestI > 0 && segments[bestI - 1].curve * sign >= bestC) bestI--;
    return bestI;
  }
  function placeCar(i, dz, offset) {
    const c = traffic[i];

  }
  function runShot(scene, ms) {
    const steps = Math.round(ms / 1000 / STEP);
    const sim = (k) => { for (let i = 0; i < k; i++) update(STEP); };
    if (scene === "title") { setupDemo(); sim(steps); render(); return; }
    if (scene === "options") { setupDemo(); mode = "options"; optSel = 3; sim(steps); render(); return; }
    lastHit = false;
    reset(QS.get("mode") || "arcade");
    if (scene === "countdown") { sim(Math.round(1.4 / STEP)); render(); return; }
    mode = "play";
    speed = MAX_SPEED;
    aiDrive = true;
    const clearNear = () => traffic.forEach((c) => { if (ahead(c.z) < 12000) c.z = (c.z + 14000) % trackLen(); });
    if (scene === "left" || scene === "right") {
      // land inside the sharpest corner of that direction without passing any checkpoint:
      // the stage, its look and its clock are set directly, so no CHECKPOINT banners fire
      const ci = findCurve(scene === "left" ? -1 : 1);
      position = (ci - 8) * SEG_LEN;
      stageIx = Math.max(0, segments[ci].stage); applyStageLook(stageIx);
      timeLeft = STAGES[stageIx].time; msgT = 0; msg = "";
      spawnTraffic(); clearNear(); sim(steps); msgT = 0;
    } else if (scene === "traffic") {
      position = 2 * SEG_LEN;
      aiDrive = false; steer = 0;
      clearNear();
      placeCar(0, 1500, -0.62); placeCar(1, 2600, 0.62); placeCar(2, 4200, 0.62); placeCar(3, 7000, -0.62); placeCar(4, 9500, 0);
      sim(1);
    } else if (scene === "offroad") {
      position = 2 * SEG_LEN;
      aiDrive = false; playerX = 1.12; steer = 0;
      sim(steps);
      playerX = 1.12;
    } else if (scene === "crash" || scene === "spin") {
      position = 2 * SEG_LEN;
      aiDrive = false; steer = 0;
      clearNear();
      placeCar(0, 2600, 0);
      for (let i = 0; i < 2000 && mode === "play" && !lastHit; i++) update(STEP);
      sim(Math.round((scene === "spin" ? 0.25 : 0.12) / STEP));
    } else if (scene === "checkpoint") {
      position = (stageEndSeg[0] - 12) * SEG_LEN; spawnTraffic(); clearNear();
      sim(Math.round(0.2 / STEP)); aiDrive = true;
      for (let i = 0; i < 600 && stageIx === 0; i++) update(STEP);
      sim(Math.round(0.3 / STEP));
    } else if (scene === "gantry") {
      position = (stageEndSeg[0] - 22) * SEG_LEN; spawnTraffic(); clearNear(); sim(1);
    } else if (scene === "results" || scene === "entry" || scene === "scores") {
      position = 30 * SEG_LEN; sim(steps);
      nearMisses = 7; spins = 1; topSpeed = MAX_SPEED * 1.25; elapsed = 252.4; timeLeft = 18.6; stageIx = 4;
      endRun("goal");
      sim(Math.round(3 / STEP));
      if (scene !== "results") { menuAction("ok"); if (scene === "entry") { menuAction("right"); menuAction("right"); } }
      if (scene === "scores") { mode = "scores"; }
    } else if (scene === "boost") {
      position = 2 * SEG_LEN; nitro = 2; boostT = 2.5; speed = MAX_SPEED * 1.2;
      sim(steps);
    } else if (scene === "pause") {
      position = 2 * SEG_LEN;
      sim(steps); pause();
    } else if (scene === "brake") {
      position = 2 * SEG_LEN; aiDrive = false; IN.kD = true; sim(steps);
    } else if (scene === "crest" || scene === "dip") {
      // biggest crest (or dip) in the arcade track, viewed from just before it
      let bestI = 40, bestV = -1e9;
      for (let i = 30; i < segments.length - 200; i++) {
        const y = segments[i].p1.world.y, v = (scene === "crest" ? 1 : -1) * (2 * y - segments[i - 25].p1.world.y - segments[i + 25].p1.world.y);
        if (v > bestV) { bestV = v; bestI = i; }
      }
      stageIx = segments[bestI].stage; applyStageLook(stageIx);
      position = (bestI - 14) * SEG_LEN; spawnTraffic(); sim(1);
    } else if (scene === "types") {
      position = 2 * SEG_LEN; aiDrive = false; steer = 0; clearNear();
      const spec = [["truck", 1500, -0.62], ["bike", 1700, 0.62], ["sports", 3200, 0.62], ["car", 4200, -0.62], ["truck", 6500, 0], ["bike", 8000, -0.62]];
      spec.forEach(([t, d, o], i) => { const c = traffic[i]; c.type = t; if (TYPES[t].wing) c.wing = TYPES[t].wing; placeCar(i, d, o); c.lockLane = true; c.lat = 0; });
      sim(1);
    } else if (scene === "blinker") {
      position = 2 * SEG_LEN; aiDrive = false; steer = 0; clearNear();
      const c = traffic[0]; c.type = "car"; placeCar(0, 2200, 0.62); c.to = 0; c.blink = 0.7; c.lockLane = false;
      const d = traffic[1]; d.type = "truck"; placeCar(1, 3400, -0.62); d.to = 0; d.mv = 0.45; d.from = -0.62; d.offset = -0.3;
      simTime = 0; render(); return;
    } else if (scene === "stage") {
      // ?shot=stage&n=K : drive a little inside stage K (biome frames)
      const k = clamp(Number(QS.get("n") || 1) - 1, 0, STAGES.length - 1);
      stageIx = k; applyStageLook(k);
      position = (stageStartSeg[k] + 40) * SEG_LEN;
      spawnTraffic();
      traffic.forEach((c) => { const d = ahead(c.z); if (d > -1200 && d < 2600) c.z = (c.z + 3000) % trackLen(); });
      sim(steps);
    } else {
      if (SHOT_STEER !== null) clearNear(); // steer review shots: keep the lane clear so the frame isn't a spin
      sim(steps);
    }
    render();
  }
  // ?debug=sfx : tap the canvas (or press 1-8) to audition every synthesised sound
  if (DEBUG === "sfx") {
    const names = Object.keys(SFX); let k = 0;
    onCanvasTap = () => { initAudio(); sfx(names[k % names.length]); sfxLabel = names[k % names.length]; k++; return true; };
    onKey = (key) => { const i = Number(key) - 1; if (i >= 0 && i < names.length) { initAudio(); sfx(names[i]); sfxLabel = names[i]; return true; } return false; };
  }

  if (globalThis.__PP_TEST) {
    globalThis.__pp = {
      get mode() { return mode; }, get score() { return score; }, get speed() { return speed; },
      get playerX() { return playerX; }, set playerX(v) { playerX = v; }, get position() { return position; }, set position(v) { position = v; },
      get traffic() { return traffic; }, get shake() { return shake; }, set shake(v) { shake = v; },
      set steer(v) { steer = v; }, get nitro() { return nitro; }, set nitro(v) { nitro = v; }, get boostT() { return boostT; }, get nearMisses() { return nearMisses; }, fireNitro, pause, resume, IN, settings, get camD() { return camD; }, set aiDrive(v) { aiDrive = v; },
      LANES, reset, update, render, startEndless() { reset("endless"); mode = "play"; }, startArcade() { reset("arcade"); mode = "play"; }, get lastHit() { return lastHit; }, get timeLeft() { return timeLeft; }, set timeLeft(v) { timeLeft = v; }, get stageIx() { return stageIx; }, get spins() { return spins; }, get results() { return results; }, get gameMode() { return gameMode; }, menuAction, STAGES, TYPES, get stageEndSeg() { return stageEndSeg; },  buildView, trafficScreen, playerBox, trackLen, STEP, MAX_SPEED, CAR_W, CAR_H, PLAYER_DZ, CAR_FRAMES, playerMap, get steerVis() { return steerVis; }, set steerVis(v) { steerVis = v; }, playerFrame
    };
  }
  if (typeof window !== "undefined") {
    window.__PALETTE = allPalette();
    // Compares every drawn traffic sprite's opaque pixel bounds against its hit box (max error in px).
    const checkBoxes = () => lastBoxes.map((b) => {
      const g = b.c.getContext("2d"), d = g.getImageData(0, 0, b.c.width, b.c.height).data;
      let x0 = 1e9, x1 = -1, y0 = 1e9, y1 = -1;
      for (let y = 0; y < b.c.height; y++) for (let x = 0; x < b.c.width; x++) if (d[(y * b.c.width + x) * 4 + 3]) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
      const vis = { x: b.drawX + x0, y: b.drawY + y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
      return { dz: b.dz, err: Math.max(Math.abs(vis.x - b.hit.x), Math.abs(vis.y - b.hit.y), Math.abs(vis.x + vis.w - b.hit.x - b.hit.w), Math.abs(vis.y + vis.h - b.hit.y - b.hit.h)), vis, hit: b.hit };
    });
    if (DEBUG || SHOT) window.__dbg = { checkBoxes, get boxes() { return lastBoxes; }, get mode() { return mode; }, trafficScreen, playerBox };
  }
  setupDemo();
  if (SHOT) {
    runShot(SHOT, Number(QS.get("t") || 1500));
    document.title = "SHOT_READY";
    if (DEBUG) {
      const pre = document.createElement("pre");
      pre.id = "boxcheck";
      pre.style.cssText = "position:fixed;left:0;top:300px;color:#000;background:#fff";
      pre.textContent = JSON.stringify({ player: playerBox(), boxes: window.__dbg.checkBoxes() });
      document.body.appendChild(pre);
    }
  } else {
    requestAnimationFrame(frame);
  }
})();
